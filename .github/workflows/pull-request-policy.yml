name: Pull Request Policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  validate-target:
    name: Validate pull request target
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce branch policy
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETA_BRANCH: ${{ vars.BETA_BRANCH || 'beta' }}
          STABLE_BRANCH: ${{ vars.STABLE_BRANCH || 'stable' }}
        run: |
          set -euo pipefail
          if [ "${BASE_BRANCH}" = "${BETA_BRANCH}" ]; then
            echo "Pull request targets ${BETA_BRANCH}."
            exit 0
          fi
          if [ "${BASE_BRANCH}" = "${STABLE_BRANCH}" ] \
            && [ "${HEAD_BRANCH}" = "${BETA_BRANCH}" ] \
            && [ "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}" ]; then
            permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${PR_AUTHOR}/permission" --jq '.permission')"
            case "${permission}" in
              admin|write)
                echo "Authorized promotion from ${BETA_BRANCH} to ${STABLE_BRANCH}."
                exit 0
                ;;
            esac
          fi
          echo "::error::Pull requests must target ${BETA_BRANCH}. Promotion from ${BETA_BRANCH} to ${STABLE_BRANCH} requires repository write permission and a branch in this repository."
          exit 1
