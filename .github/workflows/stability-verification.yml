name: Test Verification

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  RUST_BACKTRACE: "1"

jobs:
  tests:
    name: Pre-build Tests + Dev Build / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-2025-vs2026
            platform: win-x64
            rust_target: x86_64-pc-windows-msvc
            os_family: windows
          - label: Windows arm64
            runner: windows-11-vs2026-arm
            platform: win-arm64
            rust_target: aarch64-pc-windows-msvc
            os_family: windows
          - label: Linux x64
            runner: ubuntu-22.04
            platform: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            os_family: linux
          - label: Linux arm64
            runner: ubuntu-22.04-arm
            platform: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            os_family: linux
          - label: macOS arm64
            runner: macos-26
            platform: macos-arm64
            rust_target: aarch64-apple-darwin
            os_family: macos
          - label: macOS x64
            runner: macos-26-intel
            platform: macos-x64
            rust_target: x86_64-apple-darwin
            os_family: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-test-verification-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-test-verification-${{ runner.os }}-${{ matrix.platform }}-
            nuget-${{ runner.os }}-

      - name: Cache Cargo packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-verification-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-test-verification-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Download Windows assets
        if: matrix.os_family == 'windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/prebuild.py --dev --platform ${{ matrix.platform }}

      - name: Download Unix assets
        if: matrix.os_family != 'windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/prebuild.py --dev --platform ${{ matrix.platform }}

      - name: Run Windows Pre-build Tests
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: python scripts/test.py --all

      - name: Run Unix Pre-build Tests
        if: matrix.os_family != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test.py --all

      - name: Build Windows Dev app
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: python scripts/build.py --dev --platform ${{ matrix.platform }}

      - name: Build Unix Dev app
        if: matrix.os_family != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build.py --dev --platform ${{ matrix.platform }}
