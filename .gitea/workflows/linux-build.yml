name: Linux Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NETPROXY_GITHUB: ${{ vars.NETPROXY_GITHUB }}
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  RUST_BACKTRACE: "1"

jobs:
  build-linux-x64:
    name: Build / Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up .NET
        uses: https://github.com/actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Set up Python
        uses: https://github.com/actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux packaging dependencies
        shell: bash
        run: |
          set -euo pipefail

          apt_get=(apt-get)
          if [ "$(id -u)" -ne 0 ]; then
            if ! command -v sudo >/dev/null 2>&1; then
              echo "Root privileges or sudo are required to install build dependencies." >&2
              exit 1
            fi
            apt_get=(sudo apt-get)
          fi

          "${apt_get[@]}" update
          "${apt_get[@]}" install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            desktop-file-utils \
            libfontconfig1 \
            libice6 \
            libsm6 \
            libx11-6 \
            rpm \
            unzip \
            zip \
            zstd

          mkdir -p "${HOME}/.local/bin"
          curl -fL \
            -o "${HOME}/.local/bin/appimagetool" \
            "${NETPROXY_GITHUB}https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "${HOME}/.local/bin/appimagetool"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Build Linux release packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          python scripts/prebuild.py --platform linux-x64
          python scripts/build.py --platform linux-x64 --pack all

      - name: Upload Linux artifacts
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: sbproxy-linux-x64
          path: |
            build/*.zip
            build/packages/*
          if-no-files-found: error
