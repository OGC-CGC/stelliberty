[package]
name = "sbproxyrev_agent"
version = "1.0.0"
edition = "2024"
publish = false

[[bin]]
name = "sbproxyrev_agent"
path = "src/main.rs"

[dependencies]
anyhow = "^1.0.102"
async-trait = "^0.1.89"
base64 = "^0.22.1"
fs2 = "^0.4.3"
flate2 = "^1.1.5"
global-hotkey = "^0.7.0"
hub = { path = "../hub" }
image = { version = "^0.25.9", default-features = false, features = ["ico", "png"] }
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "^1.0.150"
serde_yaml_ng = "^0.10.0"
quick-xml = { version = "^0.39.3", features = ["serialize"] }
reqwest = { version = "^0.12.28", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json"] }
tao = "^0.35.2"
time = { version = "^0.3.47", features = ["formatting", "parsing", "local-offset", "macros"] }
tokio = { version = "^1.52.3", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tracing = "^0.1.44"
tracing-subscriber = { version = "^0.3.23", features = ["fmt", "env-filter"] }
tray-icon = { version = "^0.23.1", default-features = false }
walkdir = "^2.5.0"
zip = { version = "^7.2.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
